name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server — Install / Lint / Test / Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      # Lint script not defined in server/package.json — run tsc as type-level lint
      - name: 🔍 Lint / Typecheck
        run: npx tsc --noEmit

      - name: 🧪 Test (Jest)
        run: npm test -- --coverage --ci

      - name: 🏗️ Build
        run: npm run build

  client:
    name: Client — Install / Lint / Test / Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint
        run: npm run lint

      - name: 🧪 Test (Vitest)
        run: npm test -- --run

      - name: 🏗️ Build
        run: npm run build
